# The frontend, Adonis backend and pure shared domain package own the active workspace.
packages:
  - apps/*
  - packages/*

# Inject workspace build outputs so deployed dependencies remain self-contained.
# Production packaging uses the reviewed legacy adapter for the pinned local archive.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Require each project to declare the peers it actually uses. This prevents optional peers
# from silently expanding the install and keeps the server's production graph independent
# from the web app's React/test toolchain.
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false

# Sonner, Radix Select, and the dialog scroll-lock dependency inject runtime CSS. Keep their rules
# in self-hosted application stylesheets instead so production can forbid runtime style elements in CSP.
patchedDependencies:
  "@radix-ui/react-select@2.3.7": patches/@radix-ui__react-select@2.3.7.patch
  react-remove-scroll-bar@2.3.8: patches/react-remove-scroll-bar@2.3.8.patch
  sonner@2.0.8: patches/sonner@2.0.8.patch

# Conditional floors address the current advisory ranges while allowing later compatible releases.
# The documented exceptions are VitePress's Vite 6 transition, qs for typed-rest-client's exact
# vulnerable pin, and the SMTP-only Nodemailer 10 transition.
overrides:
  # Mail exposes only SMTP here; 10.1.4 fixes three parser advisories while retaining Nodemailer 10.
  "@adonisjs/mail>nodemailer": ^10.1.4
  # VitePress 1.x declares Vite 5 but its Vue plugin accepts Vite 6; use an updated 6.x release.
  vitepress>vite: ^6.4.5
  # Fixes the active fast-uri advisories without replacing consumer-supported major lines.
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=4.0.0 <4.2.3: ^4.2.3
  # GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx are all fixed by qs 6.16.0;
  # typed-rest-client 2.3.1 requests vulnerable 6.15.1 exactly.
  qs@>=6.0.0 <6.16.0: ^6.16.0
  # jsdom accepts Undici 7; these floors address the current advisory ranges below 7.30.1.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # The current Vite advisory affects 8.3.0 through 8.3.2; workspace consumers accept Vite ^8.
  vite@>=8.3.0 <8.3.3: ^8.3.3
  # Current advisories are fixed at these releases; all affected workspace consumers use these major lines.
  vue@>=3.0.0 <3.5.42: ^3.5.42
  zod@>=4.0.0 <4.6.6: ^4.6.6

# pnpm 11 blocks dependency postinstall scripts by default; esbuild's is the one we
# trust and need (it links the platform binary Vite/Vitest shell out to). Keep the
# allowlist explicit so a newly introduced lifecycle script fails a clean install.
allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  # The repository's prepare script installs the configured hooks; the dependency lifecycle is redundant.
  simple-git-hooks: false
  # Structural checks load only the published WASM grammar, never the native binding.
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  # The reviewed release archive is vendored by tag and digest, with no registry release date.
  - adonisjs-account-kit@0.1.3
  - qs@6.16.0
