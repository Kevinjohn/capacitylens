# The frontend, Adonis backend and pure shared domain package own the active workspace.
packages:
  - apps/*
  - packages/*

# Inject workspace build outputs so deployed dependencies remain self-contained.
# Production packaging uses the reviewed legacy adapter for the pinned local archive.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Require each project to declare the peers it actually uses. This prevents optional peers
# from silently expanding the install and keeps the server's production graph independent
# from the web app's React/test toolchain.
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false

# Sonner and the dialog scroll-lock dependency inject runtime CSS. Keep their rules in self-hosted
# application stylesheets instead so production can forbid runtime style elements in CSP.
patchedDependencies:
  react-remove-scroll-bar@2.3.8: patches/react-remove-scroll-bar@2.3.8.patch
  sonner@2.0.8: patches/sonner@2.0.8.patch

# Keep vulnerable transitive packages on compatible patched releases where their parents have not
# raised their own minimums. Every override remains inside the range accepted by its consumer except the reviewed SMTP-only Nodemailer major transition and
# VitePress's separately documented Vite transition below.
overrides:
  # Mail exposes only SMTP here; reviewed Nodemailer 10 fixes the mail advisories.
  "@adonisjs/mail>nodemailer": 10.1.1
  # VitePress 1.x still declares Vite 5 even though its Vue plugin supports Vite 6. Keep the docs
  # build on the first supported line containing the fixes for the Vite 5 advisories.
  vitepress>vite: 6.4.3
  brace-expansion: 5.0.12
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=4.0.0 <4.1.3: ^4.1.3
  find-my-way: 9.7.0
  nanoid: 3.3.18
  postcss: 8.5.23
  browserslist: 4.28.7
  qs: 6.16.0
  undici: 7.29.1

# pnpm 11 blocks dependency postinstall scripts by default; esbuild's is the one we
# trust and need (it links the platform binary Vite/Vitest shell out to). Keep the
# allowlist explicit so a newly introduced lifecycle script fails a clean install.
allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  # The repository's prepare script installs the configured hooks; the dependency lifecycle is redundant.
  simple-git-hooks: false
  # Structural checks load only the published WASM grammar, never the native binding.
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  # The reviewed local archive is pinned by source revision and integrity, with no registry release date.
  - adonisjs-account-kit@0.0.0
  - browserslist@4.28.7
  - fast-uri@4.1.4
  - fast-uri@3.1.7
  - qs@6.16.0
