name: capacitylens

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    depends_on:
      upgrade:
        condition: service_completed_successfully
    # The database and backups directory are inside mounted volumes so data persists across rebuilds.
    # The API image binds to 0.0.0.0 for nginx on the private Compose network.
    environment: &api-environment
      PORT: "8787"
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${CAPACITYLENS_PUBLIC_URL:-http://localhost:8080}
      SESSION_DRIVER: database
      CAPACITYLENS_DB: /data/capacitylens.db
      CAPACITYLENS_BACKUP_DIR: ${CAPACITYLENS_BACKUP_DIR-/backups}
      CAPACITYLENS_BACKUP_INTERVAL_MIN: ${CAPACITYLENS_BACKUP_INTERVAL_MIN:-60}
      CAPACITYLENS_BACKUP_KEEP: ${CAPACITYLENS_BACKUP_KEEP:-7}
      CAPACITYLENS_TRUST_PROXY_HEADERS: "1"
      CAPACITYLENS_CORS_ORIGIN: ${CAPACITYLENS_CORS_ORIGIN:-}
      CAPACITYLENS_MODE: ${CAPACITYLENS_MODE:-password-only}
      CAPACITYLENS_SECRET: ${CAPACITYLENS_SECRET:-}
      CAPACITYLENS_PUBLIC_URL: ${CAPACITYLENS_PUBLIC_URL:-http://localhost:8080}
      CAPACITYLENS_SETUP_TOKEN: ${CAPACITYLENS_SETUP_TOKEN:-}
      CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: ${CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION:-0}
      CAPACITYLENS_ALLOW_OPEN_SIGNUP: ${CAPACITYLENS_ALLOW_OPEN_SIGNUP:-0}
      CAPACITYLENS_PASSWORD_BREACH_CHECK: ${CAPACITYLENS_PASSWORD_BREACH_CHECK:-1}
      CAPACITYLENS_AUDIT: ${CAPACITYLENS_AUDIT:-on}
      CAPACITYLENS_GOOGLE_CLIENT_ID: ${CAPACITYLENS_GOOGLE_CLIENT_ID:-}
      CAPACITYLENS_GOOGLE_CLIENT_SECRET: ${CAPACITYLENS_GOOGLE_CLIENT_SECRET:-}
      CAPACITYLENS_PROVIDER_BOOTSTRAP_EMAILS: ${CAPACITYLENS_PROVIDER_BOOTSTRAP_EMAILS:-}
      CAPACITYLENS_MAIL_HOST: ${CAPACITYLENS_MAIL_HOST:-}
      CAPACITYLENS_MAIL_PORT: ${CAPACITYLENS_MAIL_PORT:-}
      CAPACITYLENS_MAIL_USER: ${CAPACITYLENS_MAIL_USER:-}
      CAPACITYLENS_MAIL_PASSWORD: ${CAPACITYLENS_MAIL_PASSWORD:-}
      CAPACITYLENS_MAIL_FROM: ${CAPACITYLENS_MAIL_FROM:-}
    volumes:
      - capacitylens-db:/data
      - capacitylens-backups:/backups
    expose:
      - "8787"

  # Finish backup and migration checks before the web process can open the database.
  upgrade:
    build:
      context: .
      target: api
    command: ["node", "ace.js", "app:upgrade"]
    restart: "no"
    read_only: true
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp:size=32m, mode=1777]
    environment: *api-environment
    volumes:
      - capacitylens-db:/data
      - capacitylens-backups:/backups
    healthcheck:
      disable: true

  web:
    build:
      context: .
      target: web
      args:
        # Set a remote API origin when the app cannot use nginx's same-origin /api proxy.
        VITE_CAPACITYLENS_API: ${VITE_CAPACITYLENS_API:-}
        # Set VITE_CAPACITYLENS_DEMO=1 to build the in-memory demo; it takes precedence over the API origin.
        VITE_CAPACITYLENS_DEMO: ${VITE_CAPACITYLENS_DEMO:-}
        VITE_CAPACITYLENS_BUILD_SHA: ${VITE_CAPACITYLENS_BUILD_SHA:-}
        VITE_CAPACITYLENS_FEEDBACK_MAILTO: ${VITE_CAPACITYLENS_FEEDBACK_MAILTO:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Bind loopback by default so a public TLS edge is the only internet-reachable hop and its
      # overwritten forwarding scheme and client address can be trusted. Set WEB_BIND_IP deliberately
      # for a platform load balancer that reaches the container host over a private network.
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"

  # Explicitly target this service for a client-only deployment:
  #   VITE_CAPACITYLENS_DEMO=1 docker compose up --build -d web-client
  # Because a service name was supplied, Compose starts only this profile and its dependencies
  # (there are none); the normal upgrade/api/web services remain stopped.
  web-client:
    profiles:
      - client-only
    build:
      context: .
      target: web-client
      args:
        VITE_CAPACITYLENS_API: ${VITE_CAPACITYLENS_API:-}
        VITE_CAPACITYLENS_DEMO: ${VITE_CAPACITYLENS_DEMO:-}
        VITE_CAPACITYLENS_BUILD_SHA: ${VITE_CAPACITYLENS_BUILD_SHA:-}
        VITE_CAPACITYLENS_FEEDBACK_MAILTO: ${VITE_CAPACITYLENS_FEEDBACK_MAILTO:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"

volumes:
  capacitylens-db:
  capacitylens-backups:
