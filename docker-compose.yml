name: capacitylens

services:
  # `docker compose up` pulls the published release images named below. `docker compose up --build`
  # builds the same images from a source checkout instead.
  api:
    image: ghcr.io/kevinjohn/capacitylens-api:${CAPACITYLENS_VERSION:?set CAPACITYLENS_VERSION to the release to run, for example 0.76.0}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    depends_on:
      upgrade:
        condition: service_completed_successfully
    # The database and backups directory are inside mounted volumes so data persists across rebuilds.
    # The API image binds to 0.0.0.0 for nginx on the private Compose network. Its port is not
    # published, so `private` proxy trust takes the client address nginx forwards from that network.
    environment: &api-environment
      PORT: '8787'
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:-}
      # Production refuses a plain-HTTP public address; set the HTTPS address your edge proxy serves.
      APP_URL: ${CAPACITYLENS_PUBLIC_URL:?set CAPACITYLENS_PUBLIC_URL to the public HTTPS address}
      CAPACITYLENS_DB: /data/capacitylens.db
      CAPACITYLENS_BACKUP_DIR: ${CAPACITYLENS_BACKUP_DIR-/backups}
      CAPACITYLENS_BACKUP_KEEP: ${CAPACITYLENS_BACKUP_KEEP:-7}
      CAPACITYLENS_TRUST_PROXY_HEADERS: private
      CAPACITYLENS_CORS_ORIGIN: ${CAPACITYLENS_CORS_ORIGIN:-}
      CAPACITYLENS_PUBLIC_URL: ${CAPACITYLENS_PUBLIC_URL:?set CAPACITYLENS_PUBLIC_URL to the public HTTPS address}
      CAPACITYLENS_ALLOW_OPEN_SIGNUP: ${CAPACITYLENS_ALLOW_OPEN_SIGNUP:-0}
      CAPACITYLENS_ALLOWED_EMAIL_DOMAINS: ${CAPACITYLENS_ALLOWED_EMAIL_DOMAINS:-}
      CAPACITYLENS_MAIL_HOST: ${CAPACITYLENS_MAIL_HOST:-}
      CAPACITYLENS_MAIL_PORT: ${CAPACITYLENS_MAIL_PORT:-}
      CAPACITYLENS_MAIL_USER: ${CAPACITYLENS_MAIL_USER:-}
      CAPACITYLENS_MAIL_PASSWORD: ${CAPACITYLENS_MAIL_PASSWORD:-}
      CAPACITYLENS_MAIL_FROM: ${CAPACITYLENS_MAIL_FROM:-}
    volumes:
      - capacitylens-db:/data
      - capacitylens-backups:/backups
    expose:
      - '8787'

  # Finish backup and migration checks before the web process can open the database.
  upgrade:
    image: ghcr.io/kevinjohn/capacitylens-api:${CAPACITYLENS_VERSION:?set CAPACITYLENS_VERSION to the release to run, for example 0.76.0}
    build:
      context: .
      target: api
    command: ['node', 'ace.js', 'app:upgrade']
    restart: 'no'
    read_only: true
    user: '1000:1000'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=32m,mode=1777']
    environment: *api-environment
    volumes:
      - capacitylens-db:/data
      - capacitylens-backups:/backups
    healthcheck:
      disable: true

  web:
    image: ghcr.io/kevinjohn/capacitylens-web:${CAPACITYLENS_VERSION:?set CAPACITYLENS_VERSION to the release to run, for example 0.76.0}
    build:
      context: .
      target: web
      args:
        # Set a remote API origin when the app cannot use nginx's same-origin /api proxy.
        VITE_CAPACITYLENS_API: ${VITE_CAPACITYLENS_API:-}
        VITE_CAPACITYLENS_BUILD_SHA: ${VITE_CAPACITYLENS_BUILD_SHA:-}
        VITE_CAPACITYLENS_FEEDBACK_MAILTO: ${VITE_CAPACITYLENS_FEEDBACK_MAILTO:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Bind loopback by default so a public TLS edge is the only internet-reachable hop and its
      # overwritten forwarding scheme and client address can be trusted. Set WEB_BIND_IP deliberately
      # for a platform load balancer that reaches the container host over a private network, and let
      # nothing else reach that address: any private peer can choose its forwarded client address.
      - '${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080'

  # Optional public HTTPS: `docker compose --profile caddy up` adds Caddy on ports 80 and 443. It
  # obtains and renews a certificate for the host in CAPACITYLENS_PUBLIC_URL and forwards to `web`
  # over the private Compose network. Without the profile, an existing edge proxy uses the loopback
  # port above. Caddy replaces a client's own forwarding headers, so nginx still sees one trusted hop.
  caddy:
    profiles:
      - caddy
    image: docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${CAPACITYLENS_PUBLIC_URL:?set CAPACITYLENS_PUBLIC_URL to the public HTTPS address}
      - --to
      - web:8080
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # Certificates and their account key live in the data volume; losing it requests new ones.
    volumes:
      - capacitylens-caddy-data:/data
      - capacitylens-caddy-config:/config

  # Explicitly target this service with a remote API origin:
  #   VITE_CAPACITYLENS_API=https://api.example.test docker compose up --build -d web-client
  # Because a service name was supplied, Compose starts only this profile and its dependencies
  # (there are none); the normal upgrade/api/web services remain stopped.
  web-client:
    profiles:
      - client-only
    build:
      context: .
      target: web-client
      args:
        VITE_CAPACITYLENS_API: ${VITE_CAPACITYLENS_API:-}
        VITE_CAPACITYLENS_BUILD_SHA: ${VITE_CAPACITYLENS_BUILD_SHA:-}
        VITE_CAPACITYLENS_FEEDBACK_MAILTO: ${VITE_CAPACITYLENS_FEEDBACK_MAILTO:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - '${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080'

volumes:
  capacitylens-db:
  capacitylens-backups:
  capacitylens-caddy-data:
  capacitylens-caddy-config:
