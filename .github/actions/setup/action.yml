name: Set up Node and pnpm
description: Install the repository's pinned Node and pnpm toolchain and frozen dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm --filter @capacitylens/shared build && pnpm --dir apps/backend codegen
      shell: bash
      env:
        NODE_ENV: test
        HOST: 127.0.0.1
        PORT: "0"
        LOG_LEVEL: error
        APP_KEY: capacitylens-build-key-0123456789abcdef
        APP_URL: http://127.0.0.1
        SESSION_DRIVER: memory
