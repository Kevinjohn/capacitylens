# npm patches and minors arrive weekly in separate groups; majors stay manual and
# are reported monthly by the major-dependency-report workflow. GitHub Actions and
# Docker updates remain monthly and patch-only.
version: 2
updates:
  - package-ecosystem: npm
    # pnpm owns one lockfile for the whole workspace. Current Dependabot/pnpm
    # tooling rejects member-directory updates when pnpm-workspace.yaml and the
    # lockfile live above them, so scan and update the workspace from its root.
    directory: /
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
