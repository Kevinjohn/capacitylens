name: security

on:
  workflow_dispatch:
    inputs:
      secret_scan_only:
        description: Run only the full-history secret scan
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "19 4 * * 2"

concurrency:
  group: >-
    security-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch' && inputs.secret_scan_only && 'secret-only' || 'full'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named rather than left to discovery: the reviewed fixture allowlist lives here, and a
          # silently unloaded config would turn this gate red on values already signed off.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  dependency-review:
    name: Dependency review
    # Supply push refs because dependency review has no pull-request base. A zero before SHA provides no range.
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0

  sbom:
    name: Source SBOM
    if: github.event_name != 'workflow_dispatch' || inputs.secret_scan_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: capacitylens.spdx.json
          artifact-name: capacitylens-source-sbom
          upload-release-assets: false

  containers:
    name: Container vulnerability scan
    if: github.event_name != 'workflow_dispatch' || inputs.secret_scan_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --target api --tag capacitylens-api:security .
      - name: Build web image
        run: docker build --target web --tag capacitylens-web:security .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capacitylens-api:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capacitylens-web:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The scan checks the only supported posture: password sign-in with scheduled backups.
  dast:
    name: OWASP ZAP baseline
    if: github.event_name != 'workflow_dispatch' || inputs.secret_scan_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_KEY: capacitylens-security-test-key-0123456789abcdef
      # Production refuses a plain-HTTP public address, so links name HTTPS while ZAP scans the
      # loopback port directly.
      CAPACITYLENS_PUBLIC_URL: https://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint CI-only credentials
        # Random per run; the stack is ephemeral and holds no real data. Minted at runtime so
        # no secret-shaped literal ever sits in the repository for scanners to flag, and masked
        # so later steps' env listings do not print them.
        run: |
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$auth_secret"
          echo "CAPACITYLENS_SECRET=$auth_secret" >> "$GITHUB_ENV"
      - name: Start production stack
        run: docker compose up --build --detach
      - name: Wait for the proxied API
        run: |
          for _ in {1..45}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          target: http://localhost:8080
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          rules_file_name: .zap/rules.tsv
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop production stack
        if: always()
        run: docker compose down --volumes

  # Scheduled and push failures have no pull request status to draw attention to them.
  # Run this report even if an earlier job fails or is canceled before a step starts.
  # The reporter ignores superseded push cancellations, reconciles visible duplicates after
  # publishing, and closes reports after a clean run. Concurrent creates converge on a later
  # push or scheduled run if GitHub's issue list is stale during both post-create reads.
  notify:
    name: Report an unattended failure
    if: always() && (github.event_name == 'schedule' || github.event_name == 'push')
    needs: [secrets, sbom, containers, dast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Checkout leaves no credentialed remote for gh to infer the repository from.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Plain text rather than JSON: these are YAML expressions, where quoting JSON is a trap.
          RESULTS: |
            secrets=${{ needs.secrets.result }}
            sbom=${{ needs.sbom.result }}
            containers=${{ needs.containers.result }}
            dast=${{ needs.dast.result }}
        run: node scripts/report-workflow-outcome.mjs
