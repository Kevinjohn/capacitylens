name: docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Compose build + production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # NODE_ENV=production is baked into the api image (Dockerfile), and auth is OFF by default
      # in this smoke. The production guard requires explicit consent for this trusted CI-only setup.
      CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
      # CI's ephemeral runner disk is encrypted by the hosted platform and stdout is retained in a
      # separate Actions log. Production requires operators to make both assurances explicitly.
      CAPACITYLENS_STORAGE_ENCRYPTED: "1"
      CAPACITYLENS_SECURITY_LOG_FORWARDING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships Docker and the Compose plugin.
      - name: Verify stable Compose storage identity
        run: |
          config="$(docker compose config)"
          echo "$config" | grep -q '^name: capacitylens$'
          for volume in capacitylens-db capacitylens-backups capacitylens-internal-tls; do
            echo "$config" | grep -q "name: capacitylens_${volume}$"
          done
      - name: Build all Docker Compose targets
        run: docker compose build
      - name: Start the production stack
        run: docker compose up -d
      - name: Wait for API health through nginx
        run: |
          for _ in {1..30}; do
            if health="$(curl -fsS http://localhost:8080/api/health)"; then
              echo "$health"
              echo "$health" | grep -q '"internalTls":{"status":"ok"'
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy" >&2
          exit 1
      - name: Verify the startup backup is readable
        run: |
          health_file="$(mktemp)"
          backup_status="pending"
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/api/health -o "$health_file"; then
              backup_status="$(node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(health.backup?.status ?? "missing");
              ' "$health_file")"
              echo "backup status: $backup_status"
              if test "$backup_status" = "ok"; then
                break
              fi
              if test "$backup_status" != "pending"; then
                echo "backup health did not become ready:" >&2
                cat "$health_file" >&2
                exit 1
              fi
            fi
            sleep 2
          done
          if test "$backup_status" != "ok"; then
            echo "backup health remained pending beyond 60 seconds:" >&2
            cat "$health_file" >&2
            exit 1
          fi

          docker compose exec -T api node - <<'NODE'
          const { readdirSync } = require("node:fs");
          const { join } = require("node:path");
          const { DatabaseSync } = require("node:sqlite");

          const backupDirectory = "/backups";
          const snapshots = readdirSync(backupDirectory)
            .filter((name) => /^capacitylens-(?:utc-)?\d{8}-\d{6}(?:-\d{3})?\.db$/.test(name))
            .sort();
          const snapshot = snapshots.at(-1);
          if (!snapshot) {
            console.error(`no published SQLite snapshot found in ${backupDirectory}`);
            process.exit(1);
          }

          const snapshotPath = join(backupDirectory, snapshot);
          const database = new DatabaseSync(snapshotPath, { readOnly: true });
          try {
            const result = database.prepare("PRAGMA integrity_check").all();
            if (result.length !== 1 || result[0]?.integrity_check !== "ok") {
              console.error(`backup integrity check failed for ${snapshotPath}: ${JSON.stringify(result)}`);
              process.exit(1);
            }
            console.log(`verified backup snapshot: ${snapshot}`);
          } finally {
            database.close();
          }
          NODE
      - name: Verify data survives API container recreation
        run: |
          created_file="$(mktemp)"
          status="$(curl -sS -o "$created_file" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"name":"Wayne Enterprises"}' \
            http://localhost:8080/api/orgs)"
          test "$status" = "201"
          account_id="$(node -e '
            const fs = require("node:fs");
            const account = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!account.id || account.name !== "Wayne Enterprises") process.exit(1);
            process.stdout.write(account.id);
          ' "$created_file")"

          docker compose up -d --no-deps --force-recreate api

          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health >/dev/null

          state_file="$(mktemp)"
          curl -fsS "http://localhost:8080/api/state?accountId=${account_id}" -o "$state_file"
          ACCOUNT_ID="$account_id" node -e '
            const fs = require("node:fs");
            const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const account = state.accounts?.find(({ id }) => id === process.env.ACCOUNT_ID);
            if (account?.name !== "Wayne Enterprises") process.exit(1);
          ' "$state_file"
      - name: Verify live internal TLS generation
        run: docker compose exec -T api node scripts/verify-tls-renewal.mjs
      - name: Smoke test security headers
        run: |
          headers="$(curl -fsS -D - -o /dev/null http://localhost:8080/)"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options:'
          echo "$headers" | grep -qi '^x-content-type-options:'
          echo "$headers" | grep -qi '^referrer-policy:'
      - name: Smoke test immutable asset caching
        run: |
          asset_path="$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"[:space:]]+\.(js|css)' | head -n 1)"
          test -n "$asset_path"
          headers="$(curl -fsS -D - -o /dev/null "http://localhost:8080${asset_path}")"
          echo "$headers"
          echo "$headers" | grep -qi '^cache-control: public, max-age=31536000, immutable'
      - name: Smoke test request body limit
        run: |
          dd if=/dev/zero of=/tmp/oversize.bin bs=1M count=7
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @/tmp/oversize.bin http://localhost:8080/)"
          echo "status=$status"
          test "$status" = "413"
      - name: Start the client-only demo without a local API
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: |
          docker compose up --build -d web-client
          test "$(docker compose ps --services --status running)" = "web-client"
          for _ in {1..30}; do
            if curl -fsS http://localhost:8081/ >/dev/null; then
              status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health)"
              test "$status" = "404"
              exit 0
            fi
            sleep 2
          done
          echo "client-only SPA never became healthy" >&2
          exit 1
      - name: Show client-only Compose logs on failure
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: docker compose logs web-client
      - name: Stop the client-only stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: docker compose down --volumes
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the production stack
        if: always()
        run: docker compose down --volumes
