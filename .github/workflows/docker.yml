name: docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Compose build + production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # NODE_ENV=production is baked into the api image (Dockerfile), and auth is OFF by default
      # in this smoke. The production guard requires explicit consent for this trusted CI-only setup.
      CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
      # CI's ephemeral runner disk is encrypted by the hosted platform and stdout is retained in a
      # separate Actions log. Production requires operators to make both assurances explicitly.
      CAPACITYLENS_STORAGE_ENCRYPTED: "1"
      CAPACITYLENS_SECURITY_LOG_FORWARDING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-latest ships Docker and the Compose plugin.
      - name: Verify stable Compose storage identity
        run: |
          config="$(docker compose config)"
          echo "$config" | grep -q '^name: capacitylens$'
          for volume in capacitylens-db capacitylens-backups capacitylens-internal-tls; do
            echo "$config" | grep -q "name: capacitylens_${volume}$"
          done
      - name: Build all Docker Compose targets
        run: docker compose build
      - name: Start the production stack
        run: docker compose up -d
      - name: Wait for API health through nginx
        run: |
          for _ in {1..30}; do
            if health="$(curl -fsS http://localhost:8080/api/health)"; then
              echo "$health"
              echo "$health" | grep -q '"internalTls":{"status":"ok"'
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy" >&2
          exit 1
      - name: Verify the startup backup is readable
        run: |
          health_file="$(mktemp)"
          backup_status="pending"
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/api/health -o "$health_file"; then
              backup_status="$(node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(health.backup?.status ?? "missing");
              ' "$health_file")"
              echo "backup status: $backup_status"
              if test "$backup_status" = "ok"; then
                break
              fi
              if test "$backup_status" != "pending"; then
                echo "backup health did not become ready:" >&2
                cat "$health_file" >&2
                exit 1
              fi
            fi
            sleep 2
          done
          if test "$backup_status" != "ok"; then
            echo "backup health remained pending beyond 60 seconds:" >&2
            cat "$health_file" >&2
            exit 1
          fi

          docker compose exec -T api node - <<'NODE'
          const { readdirSync } = require("node:fs");
          const { join } = require("node:path");
          const { DatabaseSync } = require("node:sqlite");

          const backupDirectory = "/backups";
          const snapshots = readdirSync(backupDirectory)
            .filter((name) => /^capacitylens-(?:utc-)?\d{8}-\d{6}(?:-\d{3})?\.db$/.test(name))
            .sort();
          const snapshot = snapshots.at(-1);
          if (!snapshot) {
            console.error(`no published SQLite snapshot found in ${backupDirectory}`);
            process.exit(1);
          }

          const snapshotPath = join(backupDirectory, snapshot);
          const database = new DatabaseSync(snapshotPath, { readOnly: true });
          try {
            const result = database.prepare("PRAGMA integrity_check").all();
            if (result.length !== 1 || result[0]?.integrity_check !== "ok") {
              console.error(`backup integrity check failed for ${snapshotPath}: ${JSON.stringify(result)}`);
              process.exit(1);
            }
            console.log(`verified backup snapshot: ${snapshot}`);
          } finally {
            database.close();
          }
          NODE
      - name: Verify data survives API container recreation
        run: |
          created_file="$(mktemp)"
          status="$(curl -sS -o "$created_file" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"name":"Wayne Enterprises"}' \
            http://localhost:8080/api/orgs)"
          test "$status" = "201"
          account_id="$(node -e '
            const fs = require("node:fs");
            const account = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!account.id || account.name !== "Wayne Enterprises") process.exit(1);
            process.stdout.write(account.id);
          ' "$created_file")"

          docker compose up -d --no-deps --force-recreate api

          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health >/dev/null

          state_file="$(mktemp)"
          curl -fsS "http://localhost:8080/api/state?accountId=${account_id}" -o "$state_file"
          ACCOUNT_ID="$account_id" node -e '
            const fs = require("node:fs");
            const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const account = state.accounts?.find(({ id }) => id === process.env.ACCOUNT_ID);
            if (account?.name !== "Wayne Enterprises") process.exit(1);
          ' "$state_file"
      - name: Verify live internal TLS generation
        run: docker compose exec -T api node scripts/verify-tls-renewal.mjs
      - name: Verify full Compose restart reuses internal certificate
        run: |
          before="$(curl -fsS http://localhost:8080/api/health | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).internalTls.fingerprintSha256));
          ')"
          test -n "$before"
          docker compose up -d --force-recreate
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          after="$(curl -fsS http://localhost:8080/api/health | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).internalTls.fingerprintSha256));
          ')"
          test "$before" = "$after"
      - name: Smoke test security headers
        run: |
          headers="$(curl -fsS -D - -o /dev/null http://localhost:8080/)"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options:'
          echo "$headers" | grep -qi '^x-content-type-options:'
          echo "$headers" | grep -qi '^referrer-policy:'
      - name: Keep account-route redirects on the public origin
        run: |
          headers="$(curl -sS -D - -o /dev/null -H 'Host: capacity.example.test' http://localhost:8080/account)"
          echo "$headers" | grep -q '^HTTP/1.1 301'
          echo "$headers" | grep -qi '^location: /account/'
      - name: Smoke test immutable asset caching
        run: |
          asset_path="$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"[:space:]]+\.(js|css)' | head -n 1)"
          test -n "$asset_path"
          headers="$(curl -fsS -D - -o /dev/null "http://localhost:8080${asset_path}")"
          echo "$headers"
          echo "$headers" | grep -qi '^cache-control: public, max-age=31536000, immutable'
      - name: Smoke test request body limit
        run: |
          dd if=/dev/zero of=/tmp/oversize.bin bs=1M count=7
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @/tmp/oversize.bin http://localhost:8080/)"
          echo "status=$status"
          test "$status" = "413"
      - name: Start the client-only demo without a local API
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: |
          docker compose up --build -d web-client
          test "$(docker compose ps --services --status running)" = "web-client"
          for _ in {1..30}; do
            if curl -fsS http://localhost:8081/ >/dev/null; then
              status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health)"
              test "$status" = "404"
              exit 0
            fi
            sleep 2
          done
          echo "client-only SPA never became healthy" >&2
          exit 1
      - name: Show client-only Compose logs on failure
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: docker compose logs web-client
      - name: Stop the client-only stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-client-smoke
          VITE_CAPACITYLENS_DEMO: "1"
          WEB_PORT: "8081"
        run: docker compose down --volumes
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the production stack
        if: always()
        run: docker compose down --volumes

  authenticated:
    name: Authenticated Compose and remote client smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: capacitylens-auth-smoke
      WEB_PORT: "8082"
      DOCKER_SMOKE_URL: http://127.0.0.1:8082
      SMALLSASS_ACCOUNT_DEPLOYMENT_PROFILE: self-hosted-password
      SMALLSASS_ACCOUNT_MODE: password-only
      SMALLSASS_ACCOUNT_PUBLIC_URL: https://capacity.example.test
      SMALLSASS_ACCOUNT_PASSWORD_BREACH_CHECK: "off"
      CAPACITYLENS_CORS_ORIGIN: https://client.example.test
      CAPACITYLENS_STORAGE_ENCRYPTED: "1"
      CAPACITYLENS_SECURITY_LOG_FORWARDING: "1"
      CAPACITYLENS_HTTPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Create disposable installation secrets
        run: |
          for name in SMALLSASS_ACCOUNT_SECRET SMALLSASS_ACCOUNT_SETUP_TOKEN DOCKER_SMOKE_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "DOCKER_SMOKE_ACCOUNT_ID_FILE=$RUNNER_TEMP/account-id" >> "$GITHUB_ENV"
      - name: Build and start authenticated installation
        run: docker compose up --build -d
      - name: Wait for authenticated API health
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8082/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "authenticated API never became healthy" >&2
          exit 1
      - name: Create owner, company and allocation through public proxy
        run: node scripts/docker-auth-smoke.mjs setup
      - name: Remove setup credential and recreate API
        run: |
          echo "SMALLSASS_ACCOUNT_SETUP_TOKEN=" >> "$GITHUB_ENV"
          SMALLSASS_ACCOUNT_SETUP_TOKEN= docker compose up -d --no-deps --force-recreate api
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8082/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "recreated API never became healthy" >&2
          exit 1
      - name: Verify authenticated data and closed access after recreation
        run: node scripts/docker-auth-smoke.mjs verify
      - name: Verify remote browser CORS policy
        run: |
          headers="$(curl -fsS -D - -o /dev/null -H 'Origin: https://client.example.test' http://127.0.0.1:8082/api/health)"
          echo "$headers" | grep -qi '^access-control-allow-origin: https://client.example.test'
      - name: Build and start static remote client
        env:
          COMPOSE_PROJECT_NAME: capacitylens-remote-client-smoke
          WEB_PORT: "8083"
          VITE_CAPACITYLENS_API: https://capacity.example.test
        run: |
          docker compose up --build -d web-client
          test "$(docker compose ps --services --status running)" = "web-client"
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8083/ >/dev/null; then break; fi
            sleep 2
          done
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8083/)"
          echo "$headers" | grep -qi "connect-src 'self' https://capacity.example.test"
          redirect="$(curl -sS -D - -o /dev/null -H 'Host: client.example.test' http://127.0.0.1:8083/account)"
          echo "$redirect" | grep -q '^HTTP/1.1 301'
          echo "$redirect" | grep -qi '^location: /account/'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/api/health)" = "404"
      - name: Show authenticated stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop authenticated stack
        if: always()
        run: docker compose down --volumes
      - name: Show remote client logs on failure
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-remote-client-smoke
          WEB_PORT: "8083"
          VITE_CAPACITYLENS_API: https://capacity.example.test
        run: docker compose logs web-client
      - name: Stop remote client stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: capacitylens-remote-client-smoke
          WEB_PORT: "8083"
          VITE_CAPACITYLENS_API: https://capacity.example.test
        run: docker compose down --volumes
