name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke standalone images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disposable, isolated smoke fixture; operator defaults keep password authentication enabled.
      APP_KEY: capacitylens-container-test-key-0123456789abcdef
      CAPACITYLENS_MODE: "off"
      CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
      CAPACITYLENS_PASSWORD_BREACH_CHECK: "0"
      CAPACITYLENS_PUBLIC_URL: http://127.0.0.1:8080
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and wait for readiness
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check readiness, security headers and request limit
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready > /tmp/ready.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/ready.json')); if(r.isHealthy!==true) throw Error('Not ready')"
          curl --fail --silent --show-error --dump-header /tmp/headers http://127.0.0.1:8080/ --output /dev/null
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^x-content-type-options: nosniff' /tmp/headers
          grep -qi '^referrer-policy:' /tmp/headers
          head -c 7340032 /dev/zero > /tmp/oversized-body
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data-binary @/tmp/oversized-body http://127.0.0.1:8080/api/orgs)"
          test "$status" = 413
      - name: Check scheduling data survives API recreation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            --data '{"name":"Wayne Enterprises"}' http://127.0.0.1:8080/api/orgs > /tmp/company.json
          docker compose up --detach --no-deps --force-recreate --wait --wait-timeout 120 api
          curl --fail --silent --show-error http://127.0.0.1:8080/api/state > /tmp/state.json
          node --input-type=module -e "import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('/tmp/state.json'));
          if(!state.accounts.some(a=>a.name==='Wayne Enterprises')) throw Error('Company did not survive recreation');"
      - name: Show failure diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
