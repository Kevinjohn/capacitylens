name: AdonisJS fork gate

on:
  push:
    branches: [platform/adonisjs]
  pull_request:
    branches: [platform/adonisjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adonis-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/gate.yml

  browsers:
    uses: ./.github/workflows/e2e.yml

  gate:
    name: AdonisJS fork gate
    needs: [validation, browsers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$BROWSER_RESULT" = success
