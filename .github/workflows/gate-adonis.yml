name: AdonisJS fork gate

on:
  push:
    branches: [platform/adonisjs]
  pull_request:
    branches: [platform/adonisjs, "feature/adonis-m3*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: AdonisJS fork gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - run: pnpm typecheck
      - run: pnpm --dir apps/backend lint
      - run: pnpm --dir apps/frontend lint
      - run: pnpm run security:crypto-inventory
      - run: pnpm run lanes --stop-orphans
      - run: pnpm --dir apps/backend exec node ace.js test
      - run: pnpm run lanes --stop-orphans
      - run: pnpm --dir apps/frontend test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lanes --stop-orphans
      - run: pnpm exec playwright test --project=chromium
      - run: pnpm run lanes --stop-orphans
      - run: pnpm exec playwright test --project=db-backed
      - run: pnpm run lanes --stop-orphans
      - name: Password-auth browser journeys
        run: >-
          pnpm exec playwright test --project=auth-backed
          e2e/capacity-overview.auth.spec.ts
          e2e/company-closures.auth.spec.ts
          e2e/help.auth.spec.ts
          e2e/input-contract.auth.spec.ts
          e2e/invite.auth.spec.ts
          e2e/joining.auth.spec.ts
          e2e/login.auth.spec.ts
          e2e/masquerade.auth.spec.ts
          e2e/members.auth.spec.ts
          e2e/ownership-transfer.auth.spec.ts
          e2e/person-schedule.auth.spec.ts
          e2e/private-name-permissions.auth.spec.ts
          e2e/reset-password.auth.spec.ts
          e2e/viewer.auth.spec.ts

  packaged:
    name: Standalone native package (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - run: pnpm run package:managed-release:test
      - run: pnpm run policy:packaged-smoke:test
      - run: pnpm run package:managed-release
      - run: pnpm run package:release-archive
      - name: Extract and smoke test outside the repository
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          package_scratch="$(mktemp -d)"
          trap 'rm -rf "$package_scratch"' EXIT
          archive_name="capacitylens-$package_version.tar.gz"
          (cd release && sha256sum -c "$archive_name.sha256")
          tar -xzf "release/$archive_name" -C "$package_scratch"
          pnpm run smoke:packaged-server "$package_scratch/capacitylens-$package_version/backend"
