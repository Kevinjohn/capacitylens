name: gate

# Validation reaches this workflow for main pushes (`full: false`) and for scheduled, tagged and
# manual full validation (`full: true`). Pull requests that change packaging or runtime inputs run
# only the native package jobs, with read-only permissions.
on:
  workflow_call:
    inputs:
      full:
        description: Run every tooling check, frontend coverage and the native packages.
        type: boolean
        required: true
    secrets:
      CODECOV_TOKEN:
        description: Token for optional frontend coverage reporting.
        required: false
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'scripts/release/package-managed-release.mjs'
      - 'scripts/release/deploy-managed-runtime.mjs'
      - 'scripts/release/docker/prepare-container-runtime.mjs'
      - 'scripts/release/packagedServer.mjs'
      - 'scripts/release/smoke-packaged-*.mjs'
      - 'scripts/release/loopbackHttpProxy.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/backend/package.json'
      - 'apps/backend/bin/**'
      - 'apps/backend/start/**'
      - 'packages/shared/package.json'
      - '.nvmrc'
      - '.github/workflows/gate.yml'
      - '.github/workflows/release-provenance.yml'

concurrency:
  group: gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"

  dco:
    name: DCO sign-off
    # Verify feature-commit sign-offs in the push range; merge commits are exempt. A zero before SHA provides no range.
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pushed commit is signed off
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --test scripts/check-dco.test.mjs
          node scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"

  # Selection needs only Node, git and the run history. A main push diffs from the last commit whose
  # main-push Validation succeeded, so a cancelled or failed run's changes are checked again.
  # Full validation, or no usable earlier success, runs every check.
  tooling-scope:
    name: Select tooling checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Select by the files changed since the last successful main validation
        id: select
        env:
          FULL: ${{ inputs.full }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=''
          if [ "$FULL" != true ] && [ "$EVENT_NAME" = push ]; then
            base="$(gh api "repos/$GH_REPO/actions/workflows/validation.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
          fi
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            echo "scope=$(node scripts/ci/check-changed.mjs --tooling-scope "$base")" >> "$GITHUB_OUTPUT"
          else
            echo "Full validation, or no earlier successful main validation: every tooling check runs." >> "$GITHUB_STEP_SUMMARY"
            echo "scope=run" >> "$GITHUB_OUTPUT"
          fi

  tooling:
    name: Tooling and policy checks
    needs: tooling-scope
    if: needs.tooling-scope.outputs.scope == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:tooling
        env:
          NODE_ENV: test
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1

  static:
    name: Format, lint and type-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:static
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1

  # The only application build in this workflow. Backend tests use its synced SPA assets.
  build:
    name: Production build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The root build script ends with bundle:check, so a failing budget fails this step.
      - run: pnpm run build
        env:
          NODE_ENV: production
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/backend/public/
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Coverage collection is for scheduled, tagged and manual full validation only.
      - name: Run the frontend suite
        run: |
          if [ "$FULL" = true ]; then
            pnpm --dir apps/frontend exec vitest run --coverage
          else
            pnpm --dir apps/frontend exec vitest run
          fi
      - name: Upload frontend coverage to Codecov
        if: inputs.full && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          # Reporting availability must not change the validation result.
          fail_ci_if_error: false

  backend:
    name: Backend
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/backend/public/
      - run: pnpm run policy:node-runtime:test
      - run: pnpm --dir apps/backend test

  packaged:
    name: Standalone native package (${{ matrix.target }})
    # Main pushes leave the native packages to scheduled, tagged and manual validation.
    if: github.event_name == 'pull_request' || inputs.full
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: Linux x64
            platform: linux
            architecture: x64
          - runner: macos-15
            target: macOS arm64
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Verify native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          node --input-type=module -e
          "import assert from 'node:assert/strict';
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCHITECTURE);
          console.log(process.version, process.platform, process.arch);"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
      - run: pnpm run package:managed-release:test
      - run: pnpm run policy:packaged-smoke:test
      - run: pnpm run package:managed-release
      - run: pnpm run package:release-archive
      - name: Extract and smoke test outside the repository
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          package_scratch="$(mktemp -d)"
          trap 'rm -rf "$package_scratch"' EXIT
          archive_name="capacitylens-$package_version.tar.gz"
          (cd release && shasum -a 256 --check "$archive_name.sha256")
          tar -xzf "release/$archive_name" -C "$package_scratch"
          pnpm run smoke:packaged-server "$package_scratch/capacitylens-$package_version/backend"
