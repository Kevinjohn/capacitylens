name: gate

# Deliberately no `pull_request:` trigger. The focused static-analysis and CodeQL workflows
# cover pull requests; these heavier checks run when the merge reaches `main` — or on demand
# from the Actions tab / `gh workflow run gate.yml --ref <branch>` before merging. Running
# every full workflow on each pull-request event produced several passes per change for no
# added signal.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Monthly run on the default branch: tag runs never feed the README's unqualified badge
  # (it reflects default-branch runs only), so without this the badge reads "no status"
  # between releases. Also doubles as a bit-rot canary for the toolchain.
  schedule:
    - cron: "17 6 3 * *"

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"

  dco:
    name: DCO sign-off
    # Checks every feature commit a push added to `main`; generated merge commits are exempt because
    # their parent commits carry the contributor sign-offs. Skipped when `before` is the all-zero SHA
    # (branch creation and force pushes leave no range to verify).
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pushed commit is signed off
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --test scripts/check-dco.test.mjs
          node scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"

  application:
    name: Application typecheck · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate
      - name: Upload test coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          # Coverage thresholds are enforced by `pnpm run gate`; reporting availability is not a
          # code-quality signal and must not make this required job depend on Codecov uptime.
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  server-static:
    name: Server typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check cryptographic implementation inventory
        run: pnpm run security:crypto-inventory
      - name: Check dependency graph and scanner regressions
        run: pnpm run policy:import-cycles && pnpm run policy:dependencies:test
      - name: Type-check server
        run: pnpm --filter capacitylens-server type-check
      - name: Lint server and shared packages
        run: pnpm exec eslint server shared --max-warnings 0

  server-unit:
    name: Server unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run server unit shard
        run: >-
          timeout --signal=TERM --kill-after=30s 4m
          pnpm --filter capacitylens-server test:unit-shard --
          ${{ matrix.shard }}/4

  server-process-durability:
    name: Credential onboarding crash durability
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run crash durability regression in isolation
        run: >-
          timeout --signal=TERM --kill-after=30s 4m
          pnpm --filter capacitylens-server test:credential-durability

  server-coverage:
    name: Server coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter capacitylens-server test:coverage
      - name: Upload test coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./server/coverage/lcov.info
          flags: server
          # Coverage thresholds are enforced by `pnpm run gate`; reporting availability is not a
          # code-quality signal and must not make this required job depend on Codecov uptime.
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  server:
    name: Server typecheck · lint · unit
    runs-on: ubuntu-latest
    if: always()
    needs: [server-static, server-unit, server-process-durability, server-coverage]
    steps:
      - name: Require every server check and unit shard
        env:
          COVERAGE_RESULT: ${{ needs.server-coverage.result }}
          DURABILITY_RESULT: ${{ needs.server-process-durability.result }}
          STATIC_RESULT: ${{ needs.server-static.result }}
          UNIT_RESULT: ${{ needs.server-unit.result }}
        run: |
          test "$COVERAGE_RESULT" = success
          test "$DURABILITY_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success

  account-conformance:
    name: Account boundary · ports · policies · architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run test:account-conformance

  migration-rehearsal:
    name: Released database migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Rehearse the released database migration
        run: timeout --signal=TERM --kill-after=30s 7m pnpm run rehearse:migrations
      - name: Run migration regression tests in isolation
        run: timeout --signal=TERM --kill-after=30s 7m pnpm --filter capacitylens-server test:migrations

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:deps

  release-package-smoke:
    name: Release package smoke
    # Proves the release archive works as INSTALL.md describes: unpack it, fill in the three empty
    # lines of the shipped environment example, start it with Node's own env-file loader, and get
    # both the web app and the API from one process.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the web app and the server runtime
        run: pnpm run build && pnpm --filter capacitylens-server run build:runtime
      - name: Package the release archive
        run: pnpm run package:managed-release && pnpm run package:release-archive
      - name: Check the shipped nginx site file
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=capacity.example.com \
            -keyout "$site/key.pem" -out "$site/cert.pem" 2>/dev/null
          sed -e "s|/etc/letsencrypt/live/capacity.example.com/fullchain.pem|$site/cert.pem|" \
            -e "s|/etc/letsencrypt/live/capacity.example.com/privkey.pem|$site/key.pem|" \
            production/capacitylens.nginx.conf > "$site/site.conf"
          printf 'events {}\nhttp {\n    include %s;\n}\n' "$site/site.conf" > "$site/nginx.conf"
          sudo nginx -t -c "$site/nginx.conf"
      - name: Run the extracted archive with the shipped environment file
        run: |
          set -euo pipefail
          repository="$PWD"
          name="capacitylens-$(node -p 'require("./package.json").version')"
          work="$(mktemp -d)"
          (cd release && sha256sum -c "$name.tar.gz.sha256")
          # One top-level folder, every member owned by root, so `sudo tar -x` hands nothing to a
          # local account that shares the build machine's uid.
          outside="$(tar -tzf "release/$name.tar.gz" | grep -cv "^$name/" || true)"
          test "$outside" = 0
          owners="$(tar --numeric-owner -tvzf "release/$name.tar.gz" | tr -s ' ' | cut -d ' ' -f 2 | sort -u)"
          test "$owners" = 0/0
          tar -xzf "release/$name.tar.gz" -C "$work"
          release="$work/$name"
          db=/var/lib/capacitylens/capacitylens.db
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$(dirname "$db")"

          # An unedited example refuses to start and names the empty line.
          if (cd "$release/server" && CAPACITYLENS_DB="$work/unedited.db" \
            node --env-file=../capacitylens.env.example dist/index.mjs) >"$work/unedited.log" 2>&1; then
            echo "The unedited environment example started" >&2
            exit 1
          fi
          grep -q "SMALLSASS_ACCOUNT_SECRET is required" "$work/unedited.log"

          # Fill in exactly the three empty lines, as a person following INSTALL.md would.
          secret="$(openssl rand -base64 48)"
          token="$(openssl rand -base64 48)"
          port="$((20000 + RANDOM % 20000))"
          env_file="$work/capacitylens.env"
          # The single-quoted $0 below is awk's record, not a shell expansion.
          # shellcheck disable=SC2016
          awk -v url="http://127.0.0.1:$port" -v secret="$secret" -v token="$token" '
            $0 == "SMALLSASS_ACCOUNT_PUBLIC_URL=" { $0 = $0 url; filled++ }
            $0 == "SMALLSASS_ACCOUNT_SECRET=" { $0 = $0 secret; filled++ }
            $0 == "SMALLSASS_ACCOUNT_SETUP_TOKEN=" { $0 = $0 token; filled++ }
            { print }
            END { if (filled != 3) exit 1 }
          ' "$release/capacitylens.env.example" >"$env_file"

          # A configured web directory without the app refuses instead of quietly serving API-only.
          if (cd "$release/server" && CAPACITYLENS_WEB_DIR="$work/missing" \
            node --env-file="$env_file" dist/index.mjs) >"$work/web-dir.log" 2>&1; then
            echo "A missing CAPACITYLENS_WEB_DIR started" >&2
            exit 1
          fi
          grep -qF "CAPACITYLENS_WEB_DIR=$work/missing has no index.html" "$work/web-dir.log"

          # Start the server as the unit does (working directory server/) and wait for deep health.
          wait_for_health() {
            local pid="$1" url="$2" log="$3" check="$4"
            for _ in $(seq 1 60); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log" >&2
                return 1
              fi
              if node -e "$check" "$(curl -fsS "$url" 2>/dev/null || true)" 2>/dev/null; then return 0; fi
              sleep 1
            done
            echo "No healthy answer from $url" >&2
            cat "$log" >&2
            return 1
          }
          cd "$release/server"
          PORT="$port" node --env-file="$env_file" dist/index.mjs >"$work/server.log" 2>&1 &
          server=$!
          wait_for_health "$server" "http://127.0.0.1:$port/api/health" "$work/server.log" '
            const health = JSON.parse(process.argv[1]);
            process.exit(health.ok === true && health.db === true && health.audit === "ok" &&
              health.backup?.status === "ok" ? 0 : 1);
          '
          curl -fsS -D "$work/root.headers" -o "$work/root.html" "http://127.0.0.1:$port/"
          grep -qi '^content-type: text/html' "$work/root.headers"
          grep -qi "^content-security-policy: default-src 'self'" "$work/root.headers"
          grep -q '<div id="root"' "$work/root.html"
          kill -TERM "$server"
          wait "$server"

          # The bundled recovery tool loads, reads the same environment file and reaches its
          # identity lookup against the stopped server's database.
          if node --env-file="$env_file" dist/reset-owner-password.mjs "$db" nobody@example.com \
            --confirm-server-stopped >"$work/recovery.log" 2>&1; then
            echo "Recovery unexpectedly issued a link" >&2
            exit 1
          fi
          grep -q "No identity matches that address." "$work/recovery.log"

          # A source checkout has no release marker, so its server never serves the web app.
          cd "$repository/server"
          PORT="$port" CAPACITYLENS_DB="$work/checkout.db" \
            node --env-file="$env_file" dist/index.mjs >"$work/checkout.log" 2>&1 &
          checkout=$!
          wait_for_health "$checkout" "http://127.0.0.1:$port/api/health" "$work/checkout.log" '
            process.exit(JSON.parse(process.argv[1]).ok === true ? 0 : 1);
          '
          status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/")"
          kill -TERM "$checkout"
          wait "$checkout"
          test "$status" = 404

          # Neither secret reaches anything the process printed.
          for value in "$secret" "$token"; do
            if grep -qF -- "$value" "$work"/*.log; then
              echo "A generated secret appeared in the captured output" >&2
              exit 1
            fi
          done
