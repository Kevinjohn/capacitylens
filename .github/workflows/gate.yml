name: gate

# Validation reaches this workflow for main pushes (`full: false`) and for scheduled, tagged and
# manual full validation (`full: true`).
on:
  workflow_call:
    inputs:
      full:
        description: Run every tooling check and frontend coverage.
        type: boolean
        required: true
      tree_validated:
        description: A manual Validation run already passed this exact tree; only the sign-off check runs.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: Token for optional frontend coverage reporting.
        required: false

concurrency:
  group: gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"

  dco:
    name: DCO sign-off
    # Verify feature-commit sign-offs in the push range; merge commits are exempt. A zero before SHA provides no range.
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pushed commit is signed off
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --test scripts/maintenance/check-dco.test.mjs
          node scripts/maintenance/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"

  # Selection needs only Node, git and the run history. A main push diffs from the last commit whose
  # main-push Validation succeeded, so a cancelled or failed run's changes are checked again.
  # Full validation, or no usable earlier success, runs every check.
  tooling-scope:
    name: Select tooling checks
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Select by the files changed since the last successful main validation
        id: select
        env:
          FULL: ${{ inputs.full }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=''
          if [ "$FULL" != true ] && [ "$EVENT_NAME" = push ]; then
            base="$(gh api "repos/$GH_REPO/actions/workflows/validation.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
          fi
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            echo "scope=$(node scripts/ci/check-changed.mjs --tooling-scope "$base")" >> "$GITHUB_OUTPUT"
          else
            echo "Full validation, or no earlier successful main validation: every tooling check runs." >> "$GITHUB_STEP_SUMMARY"
            echo "scope=run" >> "$GITHUB_OUTPUT"
          fi

  tooling:
    name: Tooling and policy checks
    needs: tooling-scope
    if: needs.tooling-scope.outputs.scope == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:tooling
        env:
          NODE_ENV: test
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1

  static:
    name: Format, lint and type-check
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:static
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1

  # The only application build in this workflow. Backend tests use its synced SPA assets.
  build:
    name: Production build
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The root build script ends with check:bundle, so a failing budget fails this step.
      - run: pnpm run build
        env:
          NODE_ENV: production
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/backend/public/
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend tests
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Coverage collection is for scheduled, tagged and manual full validation only.
      # The half-core ceiling protects a shared developer machine; this runner runs nothing else.
      - name: Run the frontend suite
        run: |
          CAPACITYLENS_TEST_SHARE="$(nproc)"
          export CAPACITYLENS_TEST_SHARE
          if [ "$FULL" = true ]; then
            pnpm --dir apps/frontend exec vitest run --coverage
          else
            pnpm --dir apps/frontend exec vitest run
          fi
      - name: Upload frontend coverage to Codecov
        if: inputs.full && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          # Reporting availability must not change the validation result.
          fail_ci_if_error: false

  backend:
    name: Backend
    needs: build
    if: ${{ !inputs.tree_validated }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/backend/public/
      - run: pnpm run policy:node-runtime:test
      - run: pnpm --dir apps/backend test
