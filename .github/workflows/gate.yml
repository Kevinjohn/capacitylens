name: gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Monthly run on the default branch: PR/tag runs never feed the README's unqualified
  # badge (it reflects default-branch runs only), so without this the badge reads
  # "no status" between releases. Also doubles as a bit-rot canary for the toolchain.
  schedule:
    - cron: "17 6 3 * *"

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pull-request commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            echo 'Dependabot commits are exempt from DCO sign-off.'
            exit 0
          fi
          failed=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit has no valid Signed-off-by trailer"
              failed=1
            fi
          done
          exit "$failed"

  application:
    name: Application typecheck · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate
      - name: Upload test coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          # Coverage thresholds are enforced by `pnpm run gate`; reporting availability is not a
          # code-quality signal and must not make this required job depend on Codecov uptime.
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  server-static:
    name: Server typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check cryptographic implementation inventory
        run: pnpm run security:crypto-inventory
      - name: Type-check server
        run: pnpm --filter capacitylens-server type-check
      - name: Lint server and shared packages
        run: pnpm exec eslint server shared --max-warnings 0

  server-unit:
    name: Server unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run server unit shard
        run: >-
          timeout --signal=TERM --kill-after=30s 4m
          pnpm --filter capacitylens-server exec vitest run
          --exclude src/rehearseMigrations.test.ts
          --exclude src/accounts/conformance/accountFlows.conformance.test.ts
          --pool=forks --maxWorkers=1 --shard=${{ matrix.shard }}/4

  server:
    name: Server typecheck · lint · unit
    runs-on: ubuntu-latest
    if: always()
    needs: [server-static, server-unit]
    steps:
      - name: Require every server check and unit shard
        env:
          STATIC_RESULT: ${{ needs.server-static.result }}
          UNIT_RESULT: ${{ needs.server-unit.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success

  account-conformance:
    name: Account boundary · ports · policies · architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:account-conformance

  migration-rehearsal:
    name: Released database migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse the released database migration
        run: timeout --signal=TERM --kill-after=30s 7m pnpm run rehearse:migrations
      - name: Run migration regression tests in isolation
        run: timeout --signal=TERM --kill-after=30s 7m pnpm --filter capacitylens-server test:migrations

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CapacityLens uses React Router in browser-only library mode, so no RSC server actions exist.
      # Fastify is created as an HTTP/1 server and packaged nginx proxies HTTP/1.1, so the HTTP/2
      # request-routing path in the second advisory is unreachable. Keep both exceptions exact.
      - run: pnpm audit --prod --audit-level high --ignore GHSA-qwww-vcr4-c8h2 --ignore GHSA-c96f-x56v-gq3h
