name: gate

# Deliberately no `pull_request:` trigger. Work lands through a pull request, but the
# checks run when the merge reaches `main` — or on demand from the Actions tab / `gh
# workflow run gate.yml --ref <branch>` before merging. Opening a pull request and pushing
# to its branch used to fire this workflow (and e2e, docker, security and CodeQL) on every
# event, which is several full passes per change for no added signal.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Monthly run on the default branch: tag runs never feed the README's unqualified badge
  # (it reflects default-branch runs only), so without this the badge reads "no status"
  # between releases. Also doubles as a bit-rot canary for the toolchain.
  schedule:
    - cron: "17 6 3 * *"

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"
      - name: Validate Dependabot configuration
        run: |
          ruby -e '
            require "yaml"
            doc = YAML.safe_load_file(".github/dependabot.yml")
            abort "Dependabot version must be 2" unless doc["version"] == 2
            updates = doc["updates"]
            abort "Dependabot updates must be a non-empty list" unless updates.is_a?(Array) && !updates.empty?
            updates.each do |entry|
              abort "Dependabot entry needs package-ecosystem" unless entry["package-ecosystem"].is_a?(String)
              abort "Dependabot entry needs directory" unless entry["directory"].is_a?(String)
              interval = entry.dig("schedule", "interval")
              abort "Invalid Dependabot schedule" unless %w[daily weekly monthly].include?(interval)
            end
          '

  dco:
    name: DCO sign-off
    # Checks every feature commit a push added to `main`; generated merge commits are exempt because
    # their parent commits carry the contributor sign-offs. Skipped when `before` is the all-zero SHA
    # (branch creation and force pushes leave no range to verify).
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pushed commit is signed off
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_AUTHOR: ${{ github.actor }}
        run: |
          node --test scripts/check-dco.test.mjs
          node scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR"

  application:
    name: Application typecheck · lint · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate
      - name: Upload test coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          # Coverage thresholds are enforced by `pnpm run gate`; reporting availability is not a
          # code-quality signal and must not make this required job depend on Codecov uptime.
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  server-static:
    name: Server typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check cryptographic implementation inventory
        run: pnpm run security:crypto-inventory
      - name: Type-check server
        run: pnpm --filter capacitylens-server type-check
      - name: Lint server and shared packages
        run: pnpm exec eslint server shared --max-warnings 0

  server-unit:
    name: Server unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run server unit shard
        run: >-
          timeout --signal=TERM --kill-after=30s 4m
          pnpm --filter capacitylens-server test:unit-shard --
          ${{ matrix.shard }}/4

  server-process-durability:
    name: Credential onboarding crash durability
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run crash durability regression in isolation
        run: >-
          timeout --signal=TERM --kill-after=30s 4m
          pnpm --filter capacitylens-server test:credential-durability

  server:
    name: Server typecheck · lint · unit
    runs-on: ubuntu-latest
    if: always()
    needs: [server-static, server-unit, server-process-durability]
    steps:
      - name: Require every server check and unit shard
        env:
          DURABILITY_RESULT: ${{ needs.server-process-durability.result }}
          STATIC_RESULT: ${{ needs.server-static.result }}
          UNIT_RESULT: ${{ needs.server-unit.result }}
        run: |
          test "$DURABILITY_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success

  account-conformance:
    name: Account boundary · ports · policies · architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:account-conformance

  migration-rehearsal:
    name: Released database migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse the released database migration
        run: timeout --signal=TERM --kill-after=30s 7m pnpm run rehearse:migrations
      - name: Run migration regression tests in isolation
        run: timeout --signal=TERM --kill-after=30s 7m pnpm --filter capacitylens-server test:migrations

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CapacityLens uses React Router in browser-only library mode, so no RSC server actions exist.
      # Fastify is created as an HTTP/1 server and packaged nginx proxies HTTP/1.1, so the HTTP/2
      # request-routing path in the second advisory is unreachable. Keep both exceptions exact.
      - run: pnpm run gate:deps
