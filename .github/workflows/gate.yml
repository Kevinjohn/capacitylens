name: gate

# Main pull requests receive static analysis and CodeQL; the protected Adonis fork also calls this gate.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    tags: ["v*"]
  # Monthly run on the default branch: tag runs never feed the README's unqualified badge
  # (it reflects default-branch runs only), so without this the badge reads "no status"
  # between releases. Also doubles as a bit-rot canary for the toolchain.
  schedule:
    - cron: "17 6 3 * *"

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_dir"
          "$tool_dir/actionlint"

  dco:
    name: DCO sign-off
    # Verify feature-commit sign-offs in the push range; merge commits are exempt. A zero before SHA provides no range.
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every pushed commit is signed off
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --test scripts/check-dco.test.mjs
          node scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"

  application:
    name: Application and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run gate
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --dir apps/backend typecheck
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-build-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - run: pnpm --dir apps/backend lint
      - name: Build application before backend tests
        run: pnpm run build
        env:
          NODE_ENV: production
          CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - run: pnpm --dir apps/backend test

  packaged:
    name: Standalone native package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: Linux x64
            platform: linux
            architecture: x64
          - runner: macos-15
            target: macOS arm64
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Verify native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          node --input-type=module -e
          "import assert from 'node:assert/strict';
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCHITECTURE);
          console.log(process.version, process.platform, process.arch);"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          CAPACITYLENS_ALLOW_OPEN_IN_PRODUCTION: "1"
          HOST: 127.0.0.1
          PORT: "0"
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - run: pnpm run package:managed-release:test
      - run: pnpm run policy:packaged-smoke:test
      - run: pnpm run package:managed-release
      - run: pnpm run package:release-archive
      - name: Extract and smoke test outside the repository
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          package_scratch="$(mktemp -d)"
          trap 'rm -rf "$package_scratch"' EXIT
          archive_name="capacitylens-$package_version.tar.gz"
          (cd release && shasum -a 256 --check "$archive_name.sha256")
          tar -xzf "release/$archive_name" -C "$package_scratch"
          pnpm run smoke:packaged-server "$package_scratch/capacitylens-$package_version/backend"
