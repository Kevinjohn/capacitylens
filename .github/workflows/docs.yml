name: docs

on:
  pull_request:
    paths:
      - 'docs-src/**'
      - 'scripts/docs/docs-standalone.mjs'
      - 'scripts/docs/check-docs-navigation.mjs'
      - 'scripts/docs/docs-lightbox.js'
      - 'tooling/ports.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/frontend/package.json'
      - 'packages/shared/package.json'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs-src/**'
      - 'scripts/docs/docs-standalone.mjs'
      - 'scripts/docs/check-docs-navigation.mjs'
      - 'scripts/docs/docs-lightbox.js'
      - 'tooling/ports.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/frontend/package.json'
      - 'packages/shared/package.json'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Build the standalone site with dead-link and relative-URL checks; the Pages workflow builds its own copy.
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run docs:build
      - name: Check the built site's image lightbox
        run: pnpm run docs:test
