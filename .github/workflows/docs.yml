name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - "docs/**"
      - "scripts/docs-standalone.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Validation only: VitePress fails the build on dead links, and the
    # standalone postprocess fails on any URL it cannot make relative. The
    # readable copy ships committed in docs/ — nothing is deployed from here.
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
      - name: Check the committed site matches its sources
        # docs/ is committed, and it is what readers open — the build is not
        # deployed from here. A source change whose rebuild was never committed
        # would otherwise ship silently: the site still builds, and the unit
        # tests that inspect docs/ would keep passing against the stale HTML.
        run: |
          # --porcelain, not `git diff`: a build that emits a file nobody
          # committed (a new asset, a renamed hashed stylesheet) leaves it
          # untracked, which git diff does not see — and that file is exactly
          # the kind that is missing from the site readers open.
          if [ -n "$(git status --porcelain -- docs)" ]; then
            # Which files, and then the actual hunks: a file count alone says
            # nothing about whether the cause is real staleness or a build
            # input that differs between this runner and the author's machine.
            git status --short -- docs
            git diff -- docs | head -100
            echo "::error::docs/ is out of date. Run 'pnpm run docs:build' and commit the result."
            exit 1
          fi
