name: docs

on:
  pull_request:
    paths:
      - "docs-src/**"
      - "docs/**"
      - "scripts/docs-standalone.mjs"
      - "scripts/check-docs-navigation.mjs"
      - "scripts/docs-lightbox.js"
      - "scripts/ports.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - "docs/**"
      - "scripts/docs-standalone.mjs"
      - "scripts/check-docs-navigation.mjs"
      - "scripts/docs-lightbox.js"
      - "scripts/ports.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Validate the committed standalone site with dead-link and relative-URL checks; deployment uses the committed output.
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run docs:build
      - name: Check the committed site matches its sources
        # Require a committed rebuild so changed sources cannot ship with stale generated HTML.
        run: |
          # Porcelain status includes newly emitted untracked assets, which git diff would miss.
          if [ -n "$(git status --porcelain -- docs)" ]; then
            # Which files, and then the actual hunks: a file count alone says
            # nothing about whether the cause is real staleness or a build
            # input that differs between this runner and the author's machine.
            git status --short -- docs
            git diff -- docs | head -100
            echo "::error::docs/ is out of date. Run 'pnpm run docs:build' and commit the result."
            exit 1
          fi
