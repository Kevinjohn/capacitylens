name: e2e

# Validation calls this workflow. Main pushes run the short Chromium journey (sign-in, the planner
# and saving an allocation against the real server); full validation runs every browser.
on:
  workflow_call:
    inputs:
      full:
        description: Run the Chromium, Firefox and WebKit suites instead of the main journey.
        type: boolean
        required: true

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journey:
    name: Chromium journey E2E
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e:journey
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: server-browser-e2e-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  browser-e2e:
    name: ${{ matrix.label }} E2E
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each engine runs as two shards on separate runners; both together cover its suite
          # (#1808, #2529). A runner admits two browser workers, so a second runner halves the wait.
          - label: Chromium + auth 1/2
            browser: chromium
            shard: 1-of-2
            command: pnpm run e2e --shard=1/2
          - label: Chromium + auth 2/2
            browser: chromium
            shard: 2-of-2
            command: pnpm run e2e --shard=2/2
          - label: Firefox 1/2
            browser: firefox
            shard: 1-of-2
            command: pnpm run e2e:firefox --shard=1/2
          - label: Firefox 2/2
            browser: firefox
            shard: 2-of-2
            command: pnpm run e2e:firefox --shard=2/2
          - label: WebKit 1/2
            browser: webkit
            shard: 1-of-2
            command: pnpm run e2e:webkit --shard=1/2
          - label: WebKit 2/2
            browser: webkit
            shard: 2-of-2
            command: pnpm run e2e:webkit --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Playwright's global setup builds the SPA once; every engine then starts isolated SQLite/API
      # workers, each serving that build.
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: server-browser-e2e-${{ matrix.browser }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
