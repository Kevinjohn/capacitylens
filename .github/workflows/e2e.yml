name: e2e

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['v*']
  schedule:
    - cron: '47 6 3 * *'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: ${{ matrix.label }} E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium + DB/auth
            browser: chromium
            command: pnpm run e2e
          - label: Firefox
            browser: firefox
            command: pnpm run e2e:firefox
          # Trial (#1808): two WebKit shards on separate runners; both together cover the suite.
          - label: WebKit 1/2
            browser: webkit
            shard: 1-of-2
            command: pnpm run e2e:webkit --shard=1/2
          - label: WebKit 2/2
            browser: webkit
            shard: 2-of-2
            command: pnpm run e2e:webkit --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The native first-company journey serves the built SPA from the backend's public directory.
      - name: Build and sync the production SPA
        if: matrix.browser == 'chromium'
        run: pnpm --dir apps/frontend build && node scripts/sync-adonis-public.mjs
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-e2e-${{ matrix.browser }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
