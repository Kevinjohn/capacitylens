# Disposable branch-only investigation. Do not merge this workflow into main.
name: SQLite backup runtime investigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sqlite-backup-investigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["24.19.0", "26.8.1", "26.8.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record environment and probe backup completion
        run: |
          uname -a
          node --version
          node investigation/sqlite-backup-probe.mjs
