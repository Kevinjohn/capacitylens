name: release provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attest
        required: true
        type: string

concurrency:
  group: release-provenance-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  existing-assets:
    name: Detect an already published server archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      present: ${{ steps.check.outputs.present }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the release for both server archive assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="capacitylens-${RELEASE_TAG#v}.tar.gz"
          assets="$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name')"
          # Validated assets are never rebuilt or overwritten: re-publishing or a manual dispatch stops here.
          if grep -qxF "$archive" <<<"$assets" && grep -qxF "$archive.sha256" <<<"$assets"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  provenance:
    name: Package, SBOM and provenance
    needs: existing-assets
    if: needs.existing-assets.outputs.present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Tags whose major.minor.patch is at most this one predate the runnable server archive and keep
      # their original assets. Every later tag must build it: a missing packager fails the run.
      LAST_RELEASE_WITHOUT_ARCHIVE: '0.72.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      # Keep setup self-contained: historical tags predate the repository's local setup action.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NODE_ENV: production
          CAPACITYLENS_SECRET: capacitylens-build-secret-0123456789abcdef
          CAPACITYLENS_PUBLIC_URL: https://127.0.0.1
          HOST: 127.0.0.1
          PORT: '0'
          LOG_LEVEL: error
          APP_KEY: capacitylens-test-key-0123456789abcdef
          APP_URL: http://127.0.0.1
          SESSION_DRIVER: memory
      - name: Package the web build
        run: |
          if [ -d apps/frontend/dist ]; then
            tar -czf capacitylens-web.tar.gz -C apps/frontend dist
          else
            tar -czf capacitylens-web.tar.gz dist
          fi
      - name: Generate the release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: capacitylens.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Decide whether this release carries the server archive
        id: archive
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          core="${version%%-*}"
          # Compare major.minor.patch only, so prerelease suffixes cannot reorder the comparison.
          newest="$(printf '%s\n%s\n' "$LAST_RELEASE_WITHOUT_ARCHIVE" "$core" | sort -V | tail -n 1)"
          if [ "$core" != "$LAST_RELEASE_WITHOUT_ARCHIVE" ] && [ "$newest" = "$core" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=capacitylens-$version" >> "$GITHUB_OUTPUT"
      - name: Package the runnable server archive
        if: steps.archive.outputs.enabled == 'true'
        run: |
          # Historical release tags retain their original server build command.
          # The current workspace build already compiles the Adonis backend.
          if [ ! -f apps/backend/package.json ]; then
            pnpm --filter capacitylens-server run build:runtime
          fi
          pnpm run package:managed-release
          pnpm run package:release-archive
      - name: Extract and smoke test the server archive outside the repository
        if: steps.archive.outputs.enabled == 'true'
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          # A failed smoke fails the run here, before any asset is listed, attested or uploaded.
          package_scratch="$(mktemp -d)"
          trap 'rm -rf "$package_scratch"' EXIT
          (cd release && shasum -a 256 --check "$ARCHIVE_NAME.tar.gz.sha256")
          tar -xzf "release/$ARCHIVE_NAME.tar.gz" -C "$package_scratch"
          pnpm run smoke:packaged-server "$package_scratch/$ARCHIVE_NAME/backend"
      - name: List the release assets
        id: assets
        env:
          ARCHIVE_ENABLED: ${{ steps.archive.outputs.enabled }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          printf '%s\n' capacitylens-web.tar.gz capacitylens.spdx.json > release-assets.txt
          if [ "$ARCHIVE_ENABLED" = true ]; then
            printf '%s\n' "release/$ARCHIVE_NAME.tar.gz" "release/$ARCHIVE_NAME.tar.gz.sha256" >> release-assets.txt
          fi
          {
            echo "subjects<<RELEASE_ASSETS"
            cat release-assets.txt
            echo "RELEASE_ASSETS"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the release artifacts
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
      - name: Publish artifacts and recognized provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" capacitylens-release.intoto.jsonl
          mapfile -t assets < release-assets.txt
          gh release upload "$RELEASE_TAG" \
            "${assets[@]}" \
            capacitylens-release.intoto.jsonl \
            --clobber
