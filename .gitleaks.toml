# Full-history scans allowlist specific values so real credentials in the same files remain detectable.
# Path allowlists skip whole files and could hide credentials beside accepted fixtures.
# Add only anchored patterns for values that are fake by construction.
[extend]
useDefault = true

[allowlist]
regexes = [
  # Counter-style idempotency and command keys: "idempotency-1", "wrong-idempotency-1",
  # "idempotency-2", "valid-idempotency-key-0001". Used to prove replay and mismatch handling.
  '''^(?:[a-z0-9]+-)*idempotency(?:-key)?-\d+$''',
  # Fixture and local end-to-end harness secrets, each of which names itself and carries the
  # obvious "0123456789abcdef" filler: "crash-fixture-secret-…", "correlation-test-secret-…",
  # "fixture-secret-0123456789abcdef-012345", "capacitylens-oidc-e2e-secret-…". The e2e values are
  # inline in package.json scripts that bind to localhost only.
  # The prefix consumes whole hyphen-separated segments: matching loose characters would allowlist
  # "latest-secret-…", since "la" + "test" satisfies it. scripts/check-gitleaks-config.mjs holds
  # that case as a regression test.
  '''^(?:[a-z0-9]+-)*(?:fixture|test|e2e)-secret-(?:0123456789abcdef|[0-9a-f]{16})(?:-[0-9a-f]+)?$''',
  # The matching local e2e bootstrap token, e.g. "auth-e2e-bootstrap-token-0123456789abcdef".
  '''^(?:[a-z0-9]+-)*bootstrap-token-(?:0123456789abcdef|[0-9a-f]{16})$''',
  # An immutable historical test fixture introduced before the naming convention above. Keep this
  # exact and anchored: the current test uses the standard low-entropy fixture password instead.
  '''^unique-passphrase-2026$''',
  # The production-defaults test uses this repeated hexadecimal counter as its dummy secret.
  # Historical commits retain the value, so keep the exception exact for full-history scans.
  '''^0123456789abcdef0123456789abcdef$''',
]
