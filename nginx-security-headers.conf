# Included at the server level and again in every location that defines Cache-Control. nginx drops
# inherited add_header directives when a location declares any of its own, so keeping this one
# include prevents the packaged server and client-only images from drifting apart.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src $capacitylens_connect_src; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
# HSTS is owned by the backend after trusted HTTPS detection.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
