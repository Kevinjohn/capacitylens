# CapacityLens behind nginx: a complete site file. nginx terminates TLS, serves the web app from the
# release's dist/ folder and proxies /api/ to the server on loopback.
#
#   sudo cp /opt/capacitylens/current/capacitylens.nginx.conf /etc/nginx/sites-available/capacitylens
#   (replace capacity.example.com and the certificate paths)
#   sudo ln -s /etc/nginx/sites-available/capacitylens /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Obtain the certificate first with your distribution's ACME client (for example certbot).
# The header set below mirrors the release's nginx-security-headers.conf, except that HSTS is
# host-only (no includeSubDomains), matching the server's own header.

# One Cache-Control value per response, so the security headers can be declared once at server
# level: a location that declares any add_header of its own drops every inherited one.
map "$status:$uri" $capacitylens_cache_control {
    default "no-store";
    "~^(?:200|304):/assets/" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name capacity.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name capacity.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/capacity.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capacity.example.com/privkey.pem;

    # Imports are the largest requests; the server's own limit is slightly below this.
    client_max_body_size 6m;

    root /opt/capacitylens/current/dist;
    index index.html;

    add_header Cache-Control $capacitylens_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; report-uri /api/security/csp-report; report-to csp-endpoint" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Reporting-Endpoints 'csp-endpoint="/api/security/csp-report"' always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are content-addressed, so they are cached for a year (see the map).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # A missing file-like path stays a 404 instead of receiving the app document.
    location ~* ^/(?!api/).*\.(?:css|js|mjs|json|map|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite, never append: the server trusts these headers from its loopback proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Bulk operations allow 120s; leave headroom so nginx is not the first timeout.
        proxy_read_timeout 130s;
    }

    # Invitation bearers and sign-in callback secrets must never enter the access log. These proxy
    # exactly like /api/ with the request line suppressed.
    location ~ ^/api/invites/[^/]+/(accept|signup|preview)$ {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location ~ ^/api/auth/(callback|oauth2/callback)/ {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    # /invite/<token> and /reset-password/<token> carry single-use secrets in the path. index.html is
    # served in place: a try_files fallback would redirect internally and be logged by `location /`.
    location ~ ^/(invite|reset-password)/ {
        access_log off;
        try_files /index.html =404;
    }

    # App routes: unknown paths return index.html, never cached, so a new release shows at once.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
