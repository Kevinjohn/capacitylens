# nginx config for the `web` service: serve the built Vite SPA and reverse-proxy
# /api/* to the `api` service (same-origin, so CORS stays fail-closed and the
# client's `${VITE_CAPACITYLENS_API}/api/...` requests never cross an origin).
#
# Trust only a single well-formed scheme value from the local/public edge; otherwise use the
# scheme of the connection nginx actually received. The Compose port binds loopback by default,
# so an internet client cannot reach this hop around the edge proxy.
map $http_x_forwarded_proto $capacitylens_public_proto {
    default $scheme;
    "http" http;
    "https" https;
}

# This mirrors the documented production topology (docs-src/self-hosting/tls-and-networking.md):
#   /        -> dist/ (Vite build, history-API fallback to index.html)
#   /api/*   -> the Adonis application (here: the `api` Docker service on :8787)

server {
    # The web image is deliberately unprivileged, so it listens above the privileged-port range.
    listen 8080;
    # A directory-backed SPA route can trigger nginx's slash redirect. Keep Location relative so
    # the browser stays on the public TLS origin instead of following this internal HTTP listener.
    absolute_redirect off;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;
    # The same-origin image talks only to this nginx edge. The client-only image replaces this
    # value at build time with its validated remote API origin when one is configured.
    set $capacitylens_connect_src "'self'";

    # Take the client address from the public edge's X-Forwarded-For, but only when the peer is on a
    # loopback or private network: the host proxy (Docker's loopback port arrives from the bridge
    # gateway) or a private platform load balancer. Without recursion nginx uses the last address,
    # the one the edge wrote, so a client cannot choose its own. Any other peer keeps its address.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    # Repeat the security-header include in every location that declares add_header because nginx drops inherited headers there.
    # Keep headers on errors; duplicate API and edge CSPs are enforced together.
    add_header Cache-Control "no-store" always;
    include /etc/nginx/capacitylens-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are content-addressed -> cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-declared: this location's Cache-Control add_header drops the inherited
        # server-level set (see the security-header comment above).
        include /etc/nginx/capacitylens-security-headers.conf;
        try_files $uri =404;
    }

    # A missing file-like path must stay a 404 instead of receiving the SPA document. This avoids
    # web-cache-deception/content-type confusion while still serving real root assets such as the
    # service worker. Extensionless client-side routes continue through the history fallback.
    location ~* ^/(?!api/).*\.(?:css|js|mjs|json|map|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # Reverse-proxy the API to the `api` service. The server mounts every route
    # under /api/, so the prefix is preserved (no rewrite). `api` resolves via
    # the compose network; 8787 is the server's default PORT.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append client input. $remote_addr is the edge's client (see real_ip above);
        # the API trusts this single hop for per-client limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $capacitylens_public_proto;
        proxy_set_header Connection "";
        # Client bulk operations allow 120s; leave proxy headroom so Nginx is not the first timeout.
        proxy_read_timeout 130s;
    }

    location /health/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # Invite bearer paths and OAuth callback query secrets must never enter the Nginx access log.
    # These locations proxy identically to /api/ but suppress the request line entirely. `preview`
    # is included because it is bearer-authorized by the same unguessable token in the URL path.
    location ~ ^/api/invites/[^/]+/(accept|signup|preview)$ {
        access_log off;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $capacitylens_public_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    location ~ ^/api/auth/(callback|oauth2/callback)/ {
        access_log off;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $capacitylens_public_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
    }

    # Bearer routes must never enter access logs. Serve index.html in place because an internal try_files fallback
    # would finish in the logging root location with the original token-bearing request line.
    location ~ ^/(invite|reset-password)/ {
        access_log off;
        add_header Cache-Control "no-store";
        # Re-declared: this location's Cache-Control add_header drops the inherited
        # server-level set (see the security-header comment above).
        include /etc/nginx/capacitylens-security-headers.conf;
        try_files /index.html =404;
    }

    # SPA history-API fallback: unknown paths return index.html so client-side
    # routes (react-router) resolve. index.html itself is never cached so a fresh
    # deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-store";
        # Re-declared: this location's Cache-Control add_header drops the inherited
        # server-level set (see the security-header comment above).
        include /etc/nginx/capacitylens-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
